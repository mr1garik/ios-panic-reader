name: Сборка

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Тесты
        run: python -m unittest discover -s tests -v

      - name: Сборка iOSPanicReader.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole --name iOSPanicReader
          --collect-all pymobiledevice3
          --hidden-import gui --hidden-import core --hidden-import device --hidden-import knowledge_base
          ios_panic_reader.py

      - name: Проверка запуска (консольный режим)
        shell: pwsh
        run: |
          $p = Start-Process dist\iOSPanicReader.exe -ArgumentList "--cli","tests\samples" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; Write-Error "Программа зависла"; exit 1 }
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: iOSPanicReader-Windows
          path: dist/iOSPanicReader.exe

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/iOSPanicReader.exe

  macos:
    runs-on: macos-latest   # Apple Silicon (M1 и новее)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Тесты
        run: python -m unittest discover -s tests -v

      - name: Сборка iOSPanicReader.app
        run: >
          python -m PyInstaller --noconfirm --windowed --name iOSPanicReader
          --osx-bundle-identifier com.mr1garik.iospanicreader
          --collect-all pymobiledevice3
          --hidden-import gui --hidden-import core --hidden-import device --hidden-import knowledge_base
          ios_panic_reader.py

      - name: Проверка запуска (консольный режим)
        run: dist/iOSPanicReader.app/Contents/MacOS/iOSPanicReader --cli tests/samples > /dev/null

      - name: Упаковка в zip
        run: ditto -c -k --keepParent dist/iOSPanicReader.app iOSPanicReader-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: iOSPanicReader-macOS
          path: iOSPanicReader-macOS.zip

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: iOSPanicReader-macOS.zip
