name: Сборка

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Тесты
        run: python -m unittest discover -s tests -v

      - name: Сборка iOSPanicReader.exe
        run: python scripts/build.py

      - name: Сборка установщика iOSPanicReader-Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Get-Content VERSION -Raw).Trim()
          & $iscc "/DAppVersion=$ver" installer\iOSPanicReader.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Проверка установщика (тихая установка, запуск, удаление)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\iospr-install"
          $p = Start-Process dist\iOSPanicReader-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "установка: код $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$dir\iOSPanicReader.exe")) { Write-Error "программа не установилась"; exit 1 }
          $out = "$env:RUNNER_TEMP\ver.txt"
          $p = Start-Process "$dir\iOSPanicReader.exe" -ArgumentList "--version","--out",$out -PassThru -Wait
          $ver = (Get-Content $out -Raw).Trim()
          if ($ver -ne (Get-Content VERSION -Raw).Trim()) { Write-Error "версия $ver"; exit 1 }
          Write-Host "установлена версия $ver"
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\iOSPanicReader.exe") { Write-Error "программа не удалилась"; exit 1 }
          Write-Host "установка и удаление прошли"

      - name: Новый интерфейс открывается (а не запасное окно)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:IOSPR_UI_REPORT = "$env:RUNNER_TEMP\ui.txt"; $env:IOSPR_TEST_EXIT_AFTER = "10"
          $env:USERPROFILE = "$env:RUNNER_TEMP\ui-home"; New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $p = Start-Process dist\iOSPanicReader.exe -PassThru
          $ok = $p.WaitForExit(150000)
          $logs = "$env:USERPROFILE\Documents\iOSPanicReader\updates"
          foreach ($f in "ui.log", "ui-error.log") { if (Test-Path "$logs\$f") { Write-Host "--- $f"; Get-Content "$logs\$f" | Select-Object -Last 60 } }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; Write-Error "окно не закрылось"; exit 1 }
          if (-not (Test-Path $env:IOSPR_UI_REPORT)) { Write-Error "страница не загрузилась"; exit 1 }
          $ui = (Get-Content $env:IOSPR_UI_REPORT -Raw).Trim()
          Write-Host "интерфейс: $ui"
          if ($ui -ne "web") { Write-Error "открылось запасное окно вместо нового"; exit 1 }

      - name: Сборка тестовой «новой» версии 9.9.9
        run: python scripts/build.py --dist dist-next --version 9.9.9

      - name: Проверка автообновления (старая версия обновляется до 9.9.9)
        timeout-minutes: 10
        run: python tests/e2e_update.py --old dist/iOSPanicReader.exe --new dist-next/iOSPanicReader.exe

      - name: Обновление из окна программы («Обновить сейчас» и перезапуск)
        timeout-minutes: 10
        run: python tests/e2e_update.py --mode gui --old dist/iOSPanicReader.exe --new dist-next/iOSPanicReader.exe

      - name: Обновление программы, поставленной установщиком
        timeout-minutes: 15
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\iospr-setup-upd\iOS Panic Reader"
          $p = Start-Process dist\iOSPanicReader-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "установка: код $($p.ExitCode)"; exit 1 }
          python tests/e2e_update.py --mode gui --installed "$dir\iOSPanicReader.exe" --old dist/iOSPanicReader.exe --new dist-next/iOSPanicReader.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # ярлык в «Пуске» ведёт на обновлённую программу
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "iOS Panic Reader.lnk" | Select-Object -First 1
          if (-not $lnk) { Write-Error "нет ярлыка в «Пуске»"; exit 1 }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName).TargetPath
          Write-Host "ярлык: $target"
          $out = "$env:RUNNER_TEMP\ver-lnk.txt"
          Start-Process $target -ArgumentList "--version","--out",$out -Wait
          $ver = (Get-Content $out -Raw).Trim()
          if ($ver -ne "9.9.9") { Write-Error "по ярлыку запускается версия $ver"; exit 1 }
          # удаление после самообновления
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\iOSPanicReader.exe") { Write-Error "после обновления программа не удаляется"; exit 1 }
          Write-Host "установка → обновление → ярлык → удаление: всё работает"

      # Репетиция выпуска: новая сборка с номером следующей версии, выпущенная версия с GitHub
      # обновляется до неё так же, как у людей — через окно программы и после установщика
      - name: Репетиция выпуска — сборка следующей версии
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim().Split('.'); $v[2] = [int]$v[2] + 1; $next = $v -join '.'
          "NEXT=$next" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python scripts/build.py --dist dist-rc --version $next

      - name: Репетиция выпуска — выпущенная версия (портативная) обновляется из окна
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo $env:GITHUB_REPOSITORY --pattern iOSPanicReader.exe --pattern iOSPanicReader-Setup.exe --dir published
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/e2e_update.py --old published/iOSPanicReader.exe --new dist-rc/iOSPanicReader.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/e2e_update.py --mode gui --old published/iOSPanicReader.exe --new dist-rc/iOSPanicReader.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Репетиция выпуска — установленная выпущенным установщиком обновляется из окна
        timeout-minutes: 15
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\iospr-rc\iOS Panic Reader"
          $p = Start-Process published\iOSPanicReader-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "установка: код $($p.ExitCode)"; exit 1 }
          python tests/e2e_update.py --mode gui --installed "$dir\iOSPanicReader.exe" --old published/iOSPanicReader.exe --new dist-rc/iOSPanicReader.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "iOS Panic Reader.lnk" | Select-Object -First 1
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName).TargetPath
          $out = "$env:RUNNER_TEMP\ver-rc.txt"
          Start-Process $target -ArgumentList "--version","--out",$out -Wait
          $ver = (Get-Content $out -Raw).Trim()
          if ($ver -ne $env:NEXT) { Write-Error "по ярлыку версия $ver, ждали $env:NEXT"; exit 1 }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\iOSPanicReader.exe") { Write-Error "не удаляется после обновления"; exit 1 }
          Write-Host "выпущенный установщик → обновление до $env:NEXT → ярлык → удаление: всё работает"

      - name: Проверка запуска (консольный режим)
        shell: pwsh
        run: |
          $p = Start-Process dist\iOSPanicReader.exe -ArgumentList "--cli","tests\samples" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; Write-Error "Программа зависла"; exit 1 }
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: iOSPanicReader-Windows
          path: |
            dist/iOSPanicReader.exe
            dist/iOSPanicReader-Setup.exe

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iOSPanicReader.exe
            dist/iOSPanicReader-Setup.exe

  macos:
    runs-on: macos-latest   # Apple Silicon (M1 и новее)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Тесты
        run: python -m unittest discover -s tests -v

      - name: Сборка iOSPanicReader.app
        run: python scripts/build.py

      - name: Новый интерфейс открывается (а не запасное окно)
        timeout-minutes: 5
        run: |
          export IOSPR_UI_REPORT="$RUNNER_TEMP/ui.txt" IOSPR_TEST_EXIT_AFTER=10 HOME="$RUNNER_TEMP/ui-home"
          mkdir -p "$HOME"
          dist/iOSPanicReader.app/Contents/MacOS/iOSPanicReader & pid=$!
          for i in $(seq 1 150); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          for f in ui.log ui-error.log; do [ -f "$HOME/Documents/iOSPanicReader/updates/$f" ] && { echo "--- $f"; tail -60 "$HOME/Documents/iOSPanicReader/updates/$f"; }; done
          kill -0 $pid 2>/dev/null && { kill $pid; echo "окно не закрылось"; exit 1; }
          echo "интерфейс: $(cat "$IOSPR_UI_REPORT")"
          test "$(cat "$IOSPR_UI_REPORT")" = "web"

      - name: Сборка тестовой «новой» версии 9.9.9
        run: python scripts/build.py --dist dist-next --version 9.9.9

      - name: Проверка автообновления (старая версия обновляется до 9.9.9)
        timeout-minutes: 10
        run: python tests/e2e_update.py --old dist/iOSPanicReader.app --new dist-next/iOSPanicReader.app

      - name: Обновление из окна программы («Обновить сейчас» и перезапуск)
        timeout-minutes: 10
        run: python tests/e2e_update.py --mode gui --old dist/iOSPanicReader.app --new dist-next/iOSPanicReader.app

      - name: Репетиция выпуска — выпущенная версия обновляется до следующей (тихо и из окна)
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT=$(python -c "v=open('VERSION').read().strip().split('.'); v[2]=str(int(v[2])+1); print('.'.join(v))")
          python scripts/build.py --dist dist-rc --version "$NEXT"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern iOSPanicReader-macOS.zip --dir published
          ditto -x -k published/iOSPanicReader-macOS.zip published
          python tests/e2e_update.py --old published/iOSPanicReader.app --new dist-rc/iOSPanicReader.app
          python tests/e2e_update.py --mode gui --old published/iOSPanicReader.app --new dist-rc/iOSPanicReader.app

      - name: Проверка запуска (консольный режим)
        run: dist/iOSPanicReader.app/Contents/MacOS/iOSPanicReader --cli tests/samples > /dev/null

      - name: Проверка иконки
        run: |
          ICON=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" dist/iOSPanicReader.app/Contents/Info.plist)
          echo "Иконка: $ICON"
          test "$ICON" != "icon-windowed.icns"
          ls -la "dist/iOSPanicReader.app/Contents/Resources/$ICON"

      - name: Упаковка в zip
        run: ditto -c -k --keepParent dist/iOSPanicReader.app iOSPanicReader-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: iOSPanicReader-macOS
          path: iOSPanicReader-macOS.zip

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: iOSPanicReader-macOS.zip

  # Окно на разных экранах: не под панелью задач, текст не обрезан и не налезает, контраст во всех темах
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick fonts-dejavu python3-tk > /dev/null
          python -m pip install -q -r requirements.txt
      - name: Проверка экранов
        timeout-minutes: 40
        run: |
          python tools/screen_matrix.py --out screens --screens 1280x720@96,1366x768@120,1920x1080@144,3840x2160@288 --zooms 1.0,1.6 --langs ru,en,uk
          python tools/screen_matrix.py --out screens --screens 1366x768@96 --themes dark,night,mint,graphite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens

  # Новый интерфейс в браузере: экраны, масштаб Windows, языки, темы — без обрезанного и налезающего текста
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Установка
        run: |
          python -m pip install -q -r requirements.txt
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Проверка нового интерфейса
        timeout-minutes: 40
        env:
          PYTHON: python
        run: |
          node tools/web_smoke.js
          node tools/web_matrix.js web-screens --langs=ru --themes=neon
          node tools/web_matrix.js web-screens --langs=en,uk --themes=neon --screens=1280x720@1,1366x768@1.25,3840x2160@3
          node tools/web_matrix.js web-screens --langs=ru --themes=light,dark,night,mint,graphite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screens
          path: web-screens

  # Релиз выпускается сам, когда в файле VERSION новая версия (такого тега ещё нет)
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.v.outputs.exists == 'false' }}
      version: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        id: v
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$V" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with:
          path: dist

      - name: Публикация релиза
        id: pub
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: iOS Panic Reader ${{ steps.v.outputs.tag }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/iOSPanicReader-Windows/iOSPanicReader.exe
            dist/iOSPanicReader-Windows/iOSPanicReader-Setup.exe
            dist/iOSPanicReader-macOS/iOSPanicReader-macOS.zip

  # После выпуска: прошлая версия, скачанная с GitHub, обновляется с настоящего релиза —
  # ровно то, что произойдёт у людей. Плюс установщик и прямые ссылки из README.
  after-release:
    if: needs.release.outputs.published == 'true'
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Релиз виден как последний
        shell: bash
        run: |
          V="${{ needs.release.outputs.version }}"
          for i in $(seq 1 20); do
            L=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            [ "$L" = "$V" ] && break
            echo "последний пока $L, жду…"; sleep 15
          done
          [ "$L" = "$V" ] || { echo "последний релиз $L, а не $V"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.draft, .prerelease, (.assets[] | .name + " " + (.size|tostring))'
          PREV=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" --jq "[.[] | select(.draft|not) | select(.prerelease|not) | .tag_name | select(. != \"$V\")][0]")
          echo "прошлая версия: $PREV"
          echo "PREV=$PREV" >> "$GITHUB_ENV"
          echo "NEW=${V#v}" >> "$GITHUB_ENV"

      - name: Windows — прошлая версия обновляется с GitHub
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          gh release download $env:PREV --repo $env:GITHUB_REPOSITORY --pattern iOSPanicReader.exe --dir prev
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/e2e_update.py --old prev/iOSPanicReader.exe --real $env:NEW
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Windows — ссылки из README и установщик
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
          Invoke-WebRequest "$base/iOSPanicReader.exe" -OutFile portable.exe
          Invoke-WebRequest "$base/iOSPanicReader-Setup.exe" -OutFile setup.exe
          $out = "$env:RUNNER_TEMP\v1.txt"
          Start-Process .\portable.exe -ArgumentList "--version","--out",$out -Wait
          if ((Get-Content $out -Raw).Trim() -ne $env:NEW) { Write-Error "портативная: не та версия"; exit 1 }
          $dir = "$env:RUNNER_TEMP\inst"
          Start-Process .\setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir" -Wait
          $out = "$env:RUNNER_TEMP\v2.txt"
          Start-Process "$dir\iOSPanicReader.exe" -ArgumentList "--version","--out",$out -Wait
          if ((Get-Content $out -Raw).Trim() -ne $env:NEW) { Write-Error "установщик: не та версия"; exit 1 }
          Write-Host "ссылки и установщик дают версию $env:NEW"

      - name: Mac — прошлая версия обновляется с GitHub
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          gh release download "$PREV" --repo "$GITHUB_REPOSITORY" --pattern iOSPanicReader-macOS.zip --dir prev
          ditto -x -k prev/iOSPanicReader-macOS.zip prev
          python tests/e2e_update.py --old prev/iOSPanicReader.app --real "$NEW"

      - name: Mac — ссылка из README
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o mac.zip "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/iOSPanicReader-macOS.zip"
          ditto -x -k mac.zip latest
          V=$(latest/iOSPanicReader.app/Contents/MacOS/iOSPanicReader --version)
          echo "версия по ссылке: $V"
          test "$V" = "$NEW"
