name: Сборка exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Тесты
        run: python -m unittest discover -s tests -v

      - name: Сборка iOSPanicReader.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole --name iOSPanicReader
          --collect-all pymobiledevice3
          --hidden-import gui --hidden-import core --hidden-import device --hidden-import knowledge_base
          ios_panic_reader.py

      - name: Проверка запуска exe (консольный режим)
        shell: pwsh
        run: |
          $p = Start-Process dist\iOSPanicReader.exe -ArgumentList "--cli","tests\samples" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: iOSPanicReader
          path: |
            dist/iOSPanicReader.exe
            user_kb.example.json

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iOSPanicReader.exe
            user_kb.example.json
